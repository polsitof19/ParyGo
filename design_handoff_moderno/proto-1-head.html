<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="robots" content="noindex, nofollow">
<title>Compra moderna — tres direcciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS — copiados de apps/web/app/styles/parygo-tokens.css.
   El prototipo tiene que verse nativo del producto: no invento
   paleta, no invento escala, no invento curvas.
   ============================================================ */
:root {
  --paper: #FBF7F0; --paper-2: #F4EDE1; --paper-3: #EFE6D6; --surface: #FFFFFF;
  --ink: #231C17; --ink-2: rgba(35,28,23,.70); --ink-3: rgba(35,28,23,.66);
  --line: rgba(35,28,23,.13); --sel: rgba(35,28,23,.05);
  --ok: #2E9E6B; --warn: #C7791A; --alert: #D7472F;
  --r-pill: 999px; --r-card: 14px; --r-btn: 10px; --r-ctl: 9px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --shadow-sm: 0 1px 2px rgba(35,28,23,.05), 0 6px 16px -12px rgba(35,28,23,.28);
  --shadow-md: 0 2px 6px rgba(35,28,23,.05), 0 18px 40px -22px rgba(35,28,23,.40);
  --shadow-lg: 0 4px 12px rgba(35,28,23,.06), 0 40px 80px -34px rgba(35,28,23,.50);
  --display: "Bricolage Grotesque", system-ui, sans-serif;
  --body: "Hanken Grotesk", system-ui, sans-serif;

  /* ESCALA FIJA, la misma del producto (DESIGN.md). Ninguna variante la
     cambia: si la cambiaran, el picker estaría comparando dos cosas. */
  --t0: 34px; --t1: 32px; --t2: 24px; --t3: 20px;
  --price: 18px; --lead: 17px; --bodysz: 16px; --ctl: 15px;
  --ui: 14px; --meta: 13px; --micro: 12px; --lb: 11px;
  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 48px; --s6: 64px;
  --pad: clamp(16px, 4vw, 32px);

  /* Las inyecta el JS por marca, con las MISMAS funciones del producto. */
  --brand: #FF6A3D; --brand-fill: #FF6A3D; --on-fill: #231C17;
  --brand-fill-hover: #E56138; --brand-deep: #AD4829; --brand-soft: rgba(255,106,61,.12);
}
@media (min-width: 1024px) { :root { --t1: 50px; --t2: 32px; --t3: 24px; --bodysz: 17px; --price: 21px; } }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: var(--bodysz); line-height: 1.45;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  padding-bottom: 96px; /* el picker no puede tapar el CTA sticky */
}
img { display: block; max-width: 100%; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }

/* ============================================================
   PICKER — copiado VERBATIM de .claude/skills/prototype/PICKER.md.
   No se le tocan colores, fuente ni sombras: es chrome, no compite.
   ============================================================ */
.proto-picker {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px;
  border-radius: 999px; background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 8px 24px rgba(0,0,0,0.24), 0 2px 6px rgba(0,0,0,0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px;
  background: rgba(255,255,255,0.12); will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition: transform 250ms cubic-bezier(0.23,1,0.32,1), width 250ms cubic-bezier(0.23,1,0.32,1);
}
@media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
.proto-picker-item {
  position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px;
  border: 0; border-radius: 999px; background: transparent; color: rgba(255,255,255,0.55);
  font: inherit; cursor: pointer; transition: color 150ms ease-out;
}
.proto-picker-item:hover { color: rgba(255,255,255,0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255,255,255,0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255,255,255,0.12); }
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }

/* Selector de MARCA. Chrome separado, arriba a la derecha: no es una variante,
   es el banco de pruebas (tres colores reales, uno de ellos casi blanco). */
/* UN solo botón que cicla las tres marcas. En el teléfono cualquier barra
   con tres etiquetas choca con el picker centrado y termina tapando el
   diseño, que es justo lo que hay que mirar. */
.proto-marca {
  position: fixed; top: 12px; left: 12px; z-index: 2147483646;
  padding: 4px; border-radius: 999px;
  background: rgba(10,10,10,.82); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; line-height: 1;
}
.proto-marca button {
  display: flex; align-items: center; gap: 7px; height: 28px; min-width: 28px; padding: 0 9px;
  border: 0; border-radius: 999px; background: transparent; color: #fff; cursor: pointer;
  transition: opacity 150ms ease-out, transform 140ms ease-out;
}
@media (prefers-reduced-motion: reduce) {
  .proto-marca button { transition: none; }
  .proto-marca button:active { transform: none; background: rgba(255,255,255,.18); }
}
.proto-marca button:active { transform: scale(.97); }
.proto-marca i { width: 10px; height: 10px; border-radius: 50%; display: block; flex: none; box-shadow: 0 0 0 1px rgba(255,255,255,.35); }
.proto-marca span { display: none; }
@media (min-width: 560px) { .proto-marca span { display: inline; } }
/* Lectura de contraste: diagnóstico, no diseño. Solo donde sobra lugar. */
.proto-nota {
  position: fixed; bottom: 12px; left: 12px; z-index: 2147483646; max-width: 200px; margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; line-height: 1.4;
  color: rgba(255,255,255,.72); background: rgba(10,10,10,.82); padding: 7px 10px; border-radius: 10px;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); display: none;
}
@media (min-width: 900px) { .proto-nota { display: block; } }
</style>
