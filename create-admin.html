<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Super Admin - ParyGo</title>
    <link rel="icon" type="image/png" href="assets/logos/logo.png">
    <link rel="apple-touch-icon" href="assets/logos/logo.png">
    <style>
        body {
            font-family: system-ui;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { margin-top: 0; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #f43f5e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #e11d48; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .success { 
            background: #10b981; 
            color: white; 
            padding: 15px; 
            border-radius: 6px; 
            margin-top: 20px;
        }
        .error { 
            background: #ef4444; 
            color: white; 
            padding: 15px; 
            border-radius: 6px; 
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Crear Super Admin</h1>
        <p>Este script creará tu cuenta de super administrador en Firebase Authentication y Firestore.</p>
        
        <input type="text" id="name" placeholder="Nombre completo" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Contraseña (mín. 6 caracteres)" required>
        
        <button id="btnCreate">Crear Super Admin</button>
        
        <div id="result"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANnihyrgd02ViR_GeKn6Mdf85nLwUjQg0",
            authDomain: "parygo-da36a.firebaseapp.com",
            projectId: "parygo-da36a",
            storageBucket: "parygo-da36a.firebasestorage.app",
            messagingSenderId: "58655250311",
            appId: "1:58655250311:web:9b8f46dd35d0a44ce2e522"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('btnCreate').addEventListener('click', async () => {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btnCreate');
            const result = document.getElementById('result');

            if (!name || !email || !password) {
                result.innerHTML = '<div class="error">⚠️ Completa todos los campos</div>';
                return;
            }

            if (password.length < 6) {
                result.innerHTML = '<div class="error">⚠️ La contraseña debe tener al menos 6 caracteres</div>';
                return;
            }

            btn.disabled = true;
            btn.textContent = "Creando...";
            result.innerHTML = "";

            try {
                // Crear usuario en Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;

                console.log("✅ Usuario creado en Firebase Auth:", uid);

                // Guardar en colección 'empresa' (super admin)
                await setDoc(doc(db, "empresa", uid), {
                    uid,
                    name,
                    email,
                    is_super_admin: true,
                    role: 'super_admin',
                    created_at: new Date().toISOString(),
                    status: 'ACTIVE'
                });

                console.log("✅ Super Admin guardado en Firestore");

                result.innerHTML = `
                    <div class="success">
                        ✅ <strong>Super Admin creado exitosamente</strong><br><br>
                        <strong>UID:</strong> ${uid}<br>
                        <strong>Email:</strong> ${email}<br><br>
                        Ya puedes usar esta cuenta para ingresar al sistema.
                    </div>
                `;

                // Limpiar campos
                document.getElementById('name').value = "";
                document.getElementById('email').value = "";
                document.getElementById('password').value = "";

            } catch (error) {
                console.error("Error:", error);
                
                let errorMsg = "Error al crear usuario";
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg = "Este email ya está registrado";
                } else if (error.code === 'auth/weak-password') {
                    errorMsg = "La contraseña debe tener al menos 6 caracteres";
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = "Email inválido";
                }

                result.innerHTML = `<div class="error">❌ ${errorMsg}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = "Crear Super Admin";
            }
        });
    </script>
</body>
</html>
