<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva tu entrada - ParyGo</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="apple-touch-icon" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #09090b; --surface: #18181b; --border: rgba(255,255,255,0.08); --text: #fafafa; --text-muted: #71717a; --accent: #f43f5e; --accent-soft: rgba(244,63,94,0.1); --success: #22c55e; --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; padding: 24px; }
        .header { text-align: center; margin-bottom: 32px; }
        .header img { height: 40px; margin-bottom: 16px; }
        .event-card { background: var(--surface); border-radius: var(--radius); overflow: hidden; margin-bottom: 24px; }
        .event-image { width: 100%; height: 200px; object-fit: cover; }
        .event-info { padding: 20px; }
        .event-info h1 { font-size: 24px; margin-bottom: 8px; }
        .event-info p { color: var(--text-muted); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .form-card { background: var(--surface); border-radius: var(--radius); padding: 24px; }
        .form-card h2 { font-size: 18px; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: var(--accent); }
        .btn { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #e11d48; }
        .ticket-option { padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .ticket-option:hover, .ticket-option.selected { border-color: var(--accent); background: var(--accent-soft); }
        .ticket-option h4 { margin-bottom: 4px; }
        .ticket-option p { color: var(--text-muted); font-size: 13px; }
        .ticket-price { color: var(--accent); font-weight: 600; }
        .payment-section { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
        .payment-methods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
        .payment-method { padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); text-align: center; cursor: pointer; }
        .payment-method:hover, .payment-method.selected { border-color: var(--accent); background: var(--accent-soft); }
        .payment-info { background: var(--bg); padding: 16px; border-radius: var(--radius); margin-bottom: 16px; }
        .payment-info p { margin-bottom: 8px; }
        .upload-proof { border: 2px dashed var(--border); border-radius: var(--radius); padding: 24px; text-align: center; cursor: pointer; }
        .upload-proof:hover { border-color: var(--accent); }
        .success-screen { text-align: center; padding: 40px 20px; }
        .success-screen i { font-size: 64px; color: var(--success); margin-bottom: 20px; }
        .success-screen h2 { margin-bottom: 12px; }
        .code-display { font-size: 32px; font-weight: 700; letter-spacing: 4px; background: var(--bg); padding: 20px; border-radius: var(--radius); margin: 20px 0; }
        .hidden { display: none; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface); padding: 12px 24px; border-radius: var(--radius); display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://i.ibb.co/cXtsZ8Y8/imagen-2026-01-24-230823650-1.png" alt="ParyGo" id="brandLogo">
        </div>
        
        <div id="eventSection">
            <div class="event-card">
                <img id="eventFlyer" class="event-image" src="" alt="">
                <div class="event-info">
                    <h1 id="eventName">Cargando evento...</h1>
                    <p><i class="fas fa-calendar"></i> <span id="eventDate">-</span></p>
                    <p><i class="fas fa-clock"></i> <span id="eventTime">-</span></p>
                    <p><i class="fas fa-map-marker-alt"></i> <span id="eventVenue">-</span></p>
                </div>
            </div>
            
            <div class="form-card">
                <h2>Selecciona tu entrada</h2>
                <div id="ticketOptions"></div>
                
                <h2 style="margin-top: 24px;">Tus datos</h2>
                <form id="reservationForm">
                    <div class="form-group">
                        <label>DNI</label>
                        <input type="text" id="clientDni" maxlength="8" placeholder="12345678" required>
                    </div>
                    <div class="form-group">
                        <label>Nombre completo</label>
                        <input type="text" id="clientName" placeholder="Tu nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono (WhatsApp)</label>
                        <input type="tel" id="clientPhone" placeholder="999999999" required>
                    </div>
                    <div class="form-group">
                        <label>Email (opcional)</label>
                        <input type="email" id="clientEmail" placeholder="tu@email.com">
                    </div>
                    
                    <div id="paymentSection" class="payment-section hidden">
                        <h2>Método de pago</h2>
                        <div class="payment-methods">
                            <div class="payment-method" data-method="yape">Yape</div>
                            <div class="payment-method" data-method="plin">Plin</div>
                            <div class="payment-method" data-method="transfer">Transfer</div>
                        </div>
                        <div id="paymentInfo" class="payment-info hidden"></div>
                        <div class="form-group">
                            <label>Número de operación</label>
                            <input type="text" id="operationNumber" placeholder="Ej: 12345678">
                        </div>
                        <div class="form-group">
                            <label>Comprobante de pago</label>
                            <div class="upload-proof" id="proofUpload">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <p>Click para subir imagen</p>
                                <input type="file" id="proofFile" accept="image/*" hidden>
                            </div>
                            <img id="proofPreview" class="hidden" style="max-width: 100%; margin-top: 12px; border-radius: 8px;">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn" style="margin-top: 20px;">
                        <i class="fas fa-ticket-alt"></i> Reservar Entrada
                    </button>
                </form>
            </div>
        </div>
        
        <div id="successSection" class="form-card hidden">
            <div class="success-screen">
                <i class="fas fa-check-circle"></i>
                <h2>¡Reserva exitosa!</h2>
                <p>Guarda este código para ingresar al evento</p>
                <div class="code-display" id="generatedCode">-</div>
                <img id="qrCode" src="" alt="QR" style="max-width: 200px; margin-bottom: 20px;">
                <p style="color: var(--text-muted);">Te enviaremos los detalles por WhatsApp</p>
            </div>
        </div>
    </div>
    
    <div id="toast"></div>
    
    <script>
        // Obtener parámetros de URL
        const params = new URLSearchParams(window.location.search);
        const brandSlug = params.get('brand') || window.location.pathname.split('/').pop();
        const eventId = params.get('event');
        
        let currentEvent = null;
        let currentBrand = null;
        let selectedTicket = null;
        let selectedPayment = null;
        
        // Cargar datos desde localStorage (en producción sería desde API)
        function loadData() {
            const brands = JSON.parse(localStorage.getItem('brands') || '[]');
            const events = JSON.parse(localStorage.getItem('events') || '[]');
            
            // Buscar marca
            currentBrand = brands.find(b => b.slug === brandSlug) || brands[0];
            
            if (currentBrand?.logo) {
                document.getElementById('brandLogo').src = currentBrand.logo;
            }
            
            // Buscar evento
            if (eventId) {
                currentEvent = events.find(e => e.id === eventId);
            } else if (currentBrand) {
                currentEvent = events.find(e => e.brandId === currentBrand.id && e.status === 'active');
            } else {
                currentEvent = events.find(e => e.status === 'active');
            }
            
            if (currentEvent) {
                renderEvent();
            } else {
                document.getElementById('eventSection').innerHTML = '<div class="form-card"><p style="text-align: center;">No hay eventos disponibles</p></div>';
            }
        }
        
        function renderEvent() {
            if (currentEvent.flyer) {
                document.getElementById('eventFlyer').src = currentEvent.flyer;
            }
            document.getElementById('eventName').textContent = currentEvent.name;
            document.getElementById('eventDate').textContent = formatDate(currentEvent.date);
            document.getElementById('eventTime').textContent = formatTime(currentEvent.time);
            document.getElementById('eventVenue').textContent = currentEvent.venue;
            
            // Render tickets
            const container = document.getElementById('ticketOptions');
            container.innerHTML = (currentEvent.tickets || []).map((t, i) => `
                <div class="ticket-option" data-index="${i}" data-price="${t.price}">
                    <h4>${t.name}</h4>
                    <p class="ticket-price">${t.price > 0 ? 'S/. ' + t.price.toFixed(2) : 'GRATIS'}</p>
                </div>
            `).join('');
            
            // Ticket selection
            container.querySelectorAll('.ticket-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    container.querySelectorAll('.ticket-option').forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    selectedTicket = currentEvent.tickets[opt.dataset.index];
                    
                    // Mostrar/ocultar sección de pago
                    const paymentSection = document.getElementById('paymentSection');
                    if (selectedTicket.price > 0 && currentEvent.paymentEnabled) {
                        paymentSection.classList.remove('hidden');
                    } else {
                        paymentSection.classList.add('hidden');
                    }
                });
            });
            
            // Seleccionar primer ticket por defecto
            if (currentEvent.tickets?.length) {
                container.querySelector('.ticket-option').click();
            }
        }
        
        // Payment methods
        document.querySelectorAll('.payment-method').forEach(method => {
            method.addEventListener('click', () => {
                document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('selected'));
                method.classList.add('selected');
                selectedPayment = method.dataset.method;
                showPaymentInfo();
            });
        });
        
        function showPaymentInfo() {
            const info = document.getElementById('paymentInfo');
            let html = '';
            
            if (selectedPayment === 'yape' && currentBrand?.yapeNumber) {
                html = `<p><strong>Yape:</strong> ${currentBrand.yapeNumber}</p><p><strong>Titular:</strong> ${currentBrand.yapeName || '-'}</p>`;
            } else if (selectedPayment === 'plin' && currentBrand?.plinNumber) {
                html = `<p><strong>Plin:</strong> ${currentBrand.plinNumber}</p><p><strong>Titular:</strong> ${currentBrand.plinName || '-'}</p>`;
            } else if (selectedPayment === 'transfer') {
                html = `<p><strong>Banco:</strong> ${currentBrand?.bank || '-'}</p><p><strong>Cuenta:</strong> ${currentBrand?.bankNumber || '-'}</p><p><strong>Titular:</strong> ${currentBrand?.bankName || '-'}</p><p><strong>CCI:</strong> ${currentBrand?.cci || '-'}</p>`;
            }
            
            if (html) {
                info.innerHTML = html;
                info.classList.remove('hidden');
            }
        }
        
        // Upload proof
        document.getElementById('proofUpload').addEventListener('click', () => {
            document.getElementById('proofFile').click();
        });
        
        document.getElementById('proofFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    document.getElementById('proofPreview').src = ev.target.result;
                    document.getElementById('proofPreview').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });
        
        // DNI search
        document.getElementById('clientDni').addEventListener('blur', async (e) => {
            const dni = e.target.value;
            if (dni.length === 8) {
                try {
                    const res = await fetch(`https://apiperu.dev/api/dni/${dni}`, { headers: { 'Authorization': 'Bearer demo' }});
                    const data = await res.json();
                    if (data.success) {
                        document.getElementById('clientName').value = `${data.data.nombres} ${data.data.apellido_paterno} ${data.data.apellido_materno}`;
                    }
                } catch (e) {}
            }
        });
        
        // Form submit
        document.getElementById('reservationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!selectedTicket) {
                showToast('Selecciona un tipo de entrada');
                return;
            }
            
            const clientData = {
                dni: document.getElementById('clientDni').value,
                name: document.getElementById('clientName').value,
                phone: document.getElementById('clientPhone').value,
                email: document.getElementById('clientEmail').value
            };
            
            // Generar código
            const code = generateCode();
            
            // Crear entrada
            const entry = {
                id: Date.now().toString(36) + Math.random().toString(36).substr(2),
                code,
                eventId: currentEvent.id,
                ticketType: selectedTicket.name,
                price: selectedTicket.price,
                promoterId: null,
                clientName: clientData.name,
                clientDni: clientData.dni,
                clientPhone: clientData.phone,
                clientEmail: clientData.email,
                status: selectedTicket.price > 0 ? 'pending' : 'paid',
                paymentMethod: selectedPayment,
                operationNumber: document.getElementById('operationNumber')?.value || null,
                createdAt: new Date().toISOString()
            };
            
            // Guardar comprobante
            const proofPreview = document.getElementById('proofPreview');
            if (!proofPreview.classList.contains('hidden')) {
                entry.proofImage = proofPreview.src;
            }
            
            // Guardar en localStorage
            const entries = JSON.parse(localStorage.getItem('entries') || '[]');
            entries.push(entry);
            localStorage.setItem('entries', JSON.stringify(entries));
            
            // Mostrar éxito
            document.getElementById('eventSection').classList.add('hidden');
            document.getElementById('successSection').classList.remove('hidden');
            document.getElementById('generatedCode').textContent = code;
            document.getElementById('qrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${code}`;
            
            // Enviar WhatsApp
            setTimeout(() => {
                const msg = `Hola ${clientData.name}, tu código de entrada para ${currentEvent.name} es: *${code}*`;
                window.open(`https://wa.me/${clientData.phone.replace(/\D/g, '').length === 9 ? '51' : ''}${clientData.phone.replace(/\D/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
            }, 1000);
        });
        
        function generateCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 8; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }
        
        function formatDate(d) {
            if (!d) return '-';
            return new Date(d).toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric' });
        }
        
        function formatTime(t) {
            if (!t) return '-';
            const [h, m] = t.split(':');
            return `${h % 12 || 12}:${m} ${h >= 12 ? 'PM' : 'AM'}`;
        }
        
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }
        
        loadData();
    </script>
</body>
</html>
