<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Migrar Admin - ParyGo</title>
    <link rel="icon" type="image/png" href="assets/logos/logo.png">
    <link rel="apple-touch-icon" href="assets/logos/logo.png">
    <style>
        body {
            font-family: system-ui;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { margin-top: 0; color: #333; }
        .info {
            background: #3b82f6;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
        }
        .success { 
            background: #10b981; 
            color: white; 
            padding: 15px; 
            border-radius: 6px; 
            margin: 15px 0;
        }
        .error { 
            background: #ef4444; 
            color: white; 
            padding: 15px; 
            border-radius: 6px; 
            margin: 15px 0;
        }
        .warning {
            background: #f59e0b;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #f43f5e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #e11d48; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .user-card {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
            border-left: 4px solid #3b82f6;
        }
        .label {
            font-weight: bold;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
        }
        .value {
            color: #333;
            font-size: 14px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔄 Migrar Admin a Firebase Auth</h1>
        <p>Este script migrará al usuario <strong>Matías</strong> desde Firestore a Firebase Authentication.</p>

        <div id="userInfo"></div>
        
        <button id="btnMigrate">🚀 Migrar Usuario</button>
        
        <div id="result"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANnihyrgd02ViR_GeKn6Mdf85nLwUjQg0",
            authDomain: "parygo-da36a.firebaseapp.com",
            projectId: "parygo-da36a",
            storageBucket: "parygo-da36a.firebasestorage.app",
            messagingSenderId: "58655250311",
            appId: "1:58655250311:web:9b8f46dd35d0a44ce2e522"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ID del documento de Matías (según tu captura)
        const OLD_ADMIN_ID = "OJdQL21z5yIvzUZJXG7b";

        // Cargar y mostrar info del usuario
        async function loadUserInfo() {
            const result = document.getElementById('userInfo');
            result.innerHTML = '<div class="info">⏳ Cargando información del usuario...</div>';

            try {
                const docSnap = await getDoc(doc(db, "admins", OLD_ADMIN_ID));
                
                if (!docSnap.exists()) {
                    result.innerHTML = '<div class="error">❌ Usuario no encontrado en Firestore</div>';
                    return null;
                }

                const userData = docSnap.data();
                
                result.innerHTML = `
                    <div class="user-card">
                        <div class="label">Nombre</div>
                        <div class="value">${userData.name || 'N/A'}</div>
                        
                        <div class="label">Email</div>
                        <div class="value">${userData.email || 'N/A'}</div>
                        
                        <div class="label">Rol</div>
                        <div class="value">${userData.role || userData.rol || 'N/A'}</div>
                        
                        <div class="label">Contraseña actual</div>
                        <div class="value">${userData.pass ? '••••••' : 'No encontrada'}</div>
                        
                        <div class="label">Marcas permitidas</div>
                        <div class="value">${userData.allowed_brands?.length || 0} marca(s)</div>
                    </div>
                    
                    <div class="warning">
                        ⚠️ <strong>IMPORTANTE:</strong><br>
                        Al migrar, se creará una cuenta en Firebase Auth con la contraseña actual: <strong>${userData.pass}</strong><br><br>
                        Podrás cambiarla después desde el panel de admin.
                    </div>
                `;
                
                return userData;
                
            } catch (error) {
                console.error("Error cargando usuario:", error);
                result.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                return null;
            }
        }

        // Migrar usuario
        async function migrateUser() {
            const btn = document.getElementById('btnMigrate');
            const result = document.getElementById('result');
            
            btn.disabled = true;
            btn.textContent = "Migrando...";
            result.innerHTML = "";

            try {
                // 1. Obtener datos del usuario
                result.innerHTML = '<div class="info">📖 Paso 1/4: Leyendo datos de Firestore...</div>';
                const docSnap = await getDoc(doc(db, "admins", OLD_ADMIN_ID));
                
                if (!docSnap.exists()) {
                    throw new Error("Usuario no encontrado");
                }

                const userData = docSnap.data();
                const email = userData.email;
                const password = userData.pass || "temporal123"; // Fallback si no hay contraseña

                console.log("📋 Datos del usuario:", { email, hasPassword: !!userData.pass });

                // 2. Crear usuario en Firebase Auth
                result.innerHTML = '<div class="info">🔐 Paso 2/4: Creando cuenta en Firebase Auth...</div>';
                
                let userCredential;
                try {
                    userCredential = await createUserWithEmailAndPassword(auth, email, password);
                } catch (authError) {
                    if (authError.code === 'auth/email-already-in-use') {
                        throw new Error("Este email ya tiene cuenta en Firebase Auth. Ve a Authentication → Users y elimínala primero.");
                    }
                    throw authError;
                }

                const newUID = userCredential.user.uid;
                console.log("✅ Usuario creado en Auth con UID:", newUID);

                // 3. Crear nuevo documento con UID correcto
                result.innerHTML = '<div class="info">💾 Paso 3/4: Guardando datos con nuevo UID...</div>';
                
                const newUserData = {
                    ...userData,
                    uid: newUID,
                    migrated_at: new Date().toISOString(),
                    old_id: OLD_ADMIN_ID
                };
                
                // Eliminar campo de contraseña
                delete newUserData.pass;
                
                await setDoc(doc(db, "admins", newUID), newUserData);
                console.log("✅ Datos guardados en admins/" + newUID);

                // 4. Eliminar documento antiguo (opcional - lo comentamos por seguridad)
                result.innerHTML = '<div class="info">🗑️ Paso 4/4: Limpiando documento antiguo...</div>';
                
                // DESCOMENTA LA SIGUIENTE LÍNEA SI QUIERES BORRAR EL DOCUMENTO VIEJO
                // await deleteDoc(doc(db, "admins", OLD_ADMIN_ID));
                
                console.log("⚠️ Documento antiguo NO eliminado (por seguridad)");

                // ÉXITO
                result.innerHTML = `
                    <div class="success">
                        ✅ <strong>¡Migración completada exitosamente!</strong><br><br>
                        
                        <strong>Nuevo UID:</strong> ${newUID}<br>
                        <strong>Email:</strong> ${email}<br>
                        <strong>Contraseña:</strong> ${password}<br><br>
                        
                        <strong>Próximos pasos:</strong><br>
                        1. Ve a Firebase Console → Authentication → Users<br>
                        2. Verifica que aparezca ${email}<br>
                        3. Prueba el login en tu aplicación<br><br>
                        
                        <strong>Nota:</strong> El documento antiguo (${OLD_ADMIN_ID}) sigue en Firestore por seguridad.
                        Puedes eliminarlo manualmente después de verificar que todo funciona.
                    </div>
                `;

                await loadUserInfo(); // Recargar info

            } catch (error) {
                console.error("❌ Error en migración:", error);
                
                result.innerHTML = `
                    <div class="error">
                        ❌ <strong>Error en la migración</strong><br><br>
                        ${error.message}<br><br>
                        <strong>Código:</strong> ${error.code || 'N/A'}
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = "🚀 Migrar Usuario";
            }
        }

        // Event listeners
        document.getElementById('btnMigrate').addEventListener('click', migrateUser);

        // Cargar info al inicio
        loadUserInfo();

        console.log("📱 Script de migración cargado");
    </script>
</body>
</html>
